name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - nginx/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy infra via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            git -C ${{ vars.INFRA_DIR }} fetch origin
            git -C ${{ vars.INFRA_DIR }} checkout main
            git -C ${{ vars.INFRA_DIR }} pull origin main
            cd ${{ vars.INFRA_DIR }}
            # compose 설정 변경 적용 (이미지 재빌드 X — 앱 빌드는 client 배포 담당)
            docker compose up -d
            # nginx conf(마운트) 변경 반영: 검증 후 무중단 reload
            docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload
